  <link rel="icon" href="img/logo.png">

          <span class="marca-nome">Minha Colheita</span>

      <nav class="menu-links">
        <a class="menu-link ativo" href="dashboard.html">

        <a class="menu-link" href="pages/listagemTalhao.html">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/><path d="M5 21h14"/></svg>
          Talhões

        <a class="menu-link" href="pages/nova-aplicacao.html">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h.01"/><path d="M7 5h.01"/><path d="M11 7h.01"/><path d="M3 7h.01"/><path d="M7 9h.01"/><path d="M3 11h.01"/><rect width="4" height="4" x="15" y="5"/><path d="m19 9 2 2v10c0 .6-.4 1-1 1h-6c-.6 0-1-.4-1-1V11l2-2"/><path d="m13 14 8-2"/><path d="m13 19 8-2"/></svg>
          Nova aplicação

        <a class="menu-link" href="consulta.html">

          Avisos
        </a>
        <a class="menu-link" href="relatorios.html">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>

        </a>

    <!-- Ícones: Lucide (lucide.dev), licença ISC -->

        <span class="etiqueta">Monitoramento ativo</span>

          <div>
            <h1 id="saudacao"></h1>
            <p class="destaque-data" id="data-hoje"></p>

          <a class="botao-acao" href="pages/cadastroTalhao.html">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>

          </a>
        </div>

      <div class="colunas">

        <section>
          <div class="secao-topo">
            <h2>Seus talhões</h2>
            <a class="ver-todos" href="pages/listagemTalhao.html">

              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </a>
          </div>

          <div id="lista-talhoes"></div>
        </section>

        <div>

          <section class="cartao">
            <div class="secao-topo">
              <h2>Alertas recentes</h2>
              <a class="ver-todos" href="pages/avisos.html">
                Ver todos
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </a>
            </div>

            <ul class="lista-alertas" id="lista-alertas"></ul>
          </section>

          <section class="cartao">
            <p class="cartao-rotulo">Próxima liberação</p>
            <div id="proxima-liberacao"></div>
          </section>

        </div>

      </div>

    </main>

  </div>

  <script src="js/dashboard.js"></script>
