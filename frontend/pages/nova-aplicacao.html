      <!-- CABEÇALHO -->
      <header class="aplicacao-cabecalho">
        <h1>Registrar aplicação</h1>

        <p>
          Registre uma aplicação de agrotóxico para controlar
          o período de carência
        </p>
      </header>

      <!-- FORMULÁRIO -->
      <form id="form-aplicacao" class="aplicacao-formulario">

        <div class="aplicacao-campo">
          <label for="talhao">
            Talhão <span class="obrigatorio">*</span>
          </label>

          <select id="talhao" name="talhao" required>
            <option value="">Selecione o talhão</option>
            <option value="A1">Talhão A1</option>
          </select>
        </div>

        <div class="aplicacao-campo">
          <label for="produto">
            Produto aplicado <span class="obrigatorio">*</span>
          </label>

          <input
            type="text"
            id="produto"
            name="produto"
            placeholder="Buscar pelo nome do produto ou ingrediente ativo..."
            required
          >
        </div>

        <div class="aplicacao-linha">

          <div class="aplicacao-campo">
            <label for="dose">
              Dose aplicada <span class="obrigatorio">*</span>
            </label>

            <input
              type="number"
              id="dose"
              name="dose"
              min="0.01"
              step="any"
              placeholder="Ex.: 1,5"
              required
            >
          </div>

          <div class="aplicacao-campo aplicacao-unidade">
            <label for="unidade">Unidade</label>

            <select id="unidade" name="unidade" required>
              <option value="L/ha">L/ha</option>
              <option value="mL/ha">mL/ha</option>
              <option value="kg/ha">kg/ha</option>
              <option value="g/ha">g/ha</option>
            </select>
          </div>

        </div>

        <div class="aplicacao-campo">
          <label for="data-aplicacao">
            Data de aplicação <span class="obrigatorio">*</span>
          </label>

          <input
            type="date"
            id="data-aplicacao"
            name="data_aplicacao"
            required
          >
        </div>

        <div class="aplicacao-campo">
          <label for="responsavel">
            Responsável técnico (opcional)
          </label>

          <input
            type="text"
            id="responsavel"
            name="responsavel"
            placeholder="Nome do Eng. Agrônomo ou responsável"
          >
        </div>

        <div class="aplicacao-campo aplicacao-campo-observacoes">
          <label for="observacoes">
            Observações (opcional)
          </label>

          <input
            type="text"
            id="observacoes"
            name="observacoes"
            placeholder="Condições climáticas, equipamento utilizado..."
          >
        </div>

        <!-- BOTÕES -->
        <div class="aplicacao-acoes">

          <button
            type="button"
            class="botao botao-secundario"
            onclick="window.location.href='../dashboard.html'"
          >
            Cancelar
          </button>

          <button type="submit" class="botao botao-destaque">
            Registrar aplicação
          </button>

        </div>

      </form>
