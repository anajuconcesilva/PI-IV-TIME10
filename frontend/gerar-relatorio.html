    <main class="conteudo">
      <a href="relatorios.html" class="voltar-link">
        <svg class="icone" viewBox="0 0 24 24" width="16" height="16"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Voltar

      <h1 class="chamada-titulo" style="font-size: 32px; color: var(--cor-marinho); margin-bottom: 4px;">Registrar de Conformidade</h1>
      <p class="subtitulo">Adicione as informações e gere seu relatório:</p>

      <form id="form-relatorio" class="caixa-branca">
        <div class="grid-3">
          <div class="campo">
            <label>Fazenda <span class="obrigatorio">*</span></label>
            <select required>
              <option value="">Selecione a fazenda</option>
              <option>Fazenda São Luís</option>
            </select>
          </div>
          <div class="campo">
            <label>Talhão <span class="obrigatorio">*</span></label>
            <select required>
              <option value="">Selecione o talhão</option>
              <option>Todos os talhões</option>
              <option>Talhão A1</option>
            </select>
          </div>
          <div class="campo">
            <label>Tipo de Documento <span class="obrigatorio">*</span></label>
            <select required>
              <option value="">Selecione o tipo</option>
              <option>Relatório de Conformidade</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label>Período de Início e Fim <span class="obrigatorio">*</span></label>
        </div>
        <div class="grid-2">
          <div class="campo">
            <label>Início</label>
            <input type="date" required>
          </div>
          <div class="campo">
            <label>Fim</label>
            <input type="date" required>
          </div>
        </div>


        <div class="acoes-footer">
          <button type="button" class="botao botao-secundario" onclick="window.location.href='relatorios.html'">Cancelar</button>
          <button type="submit" class="botao botao-destaque">Gerar Relatório (PDF)</button>
        </div>
      </form>
    </main>
